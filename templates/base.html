<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoGuard{% endblock %}</title>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- App Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=2.0">
    
    <style>
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Top Navigation -->
        <nav class="top-nav">
            <div class="nav-left">
                <a href="/" class="app-logo">
                    <i class="bi bi-shield-check"></i>
                    <span>AutoGuard</span>
                </a>
            </div>
            
            <div class="nav-right">
                <div class="status-pill">
                    <span class="status-dot"></span>
                    <span>LIVE</span>
                </div>
                
                <div class="user-menu">
                    <div class="user-avatar">{{ role[0]|upper if role else 'U' }}</div>
                    <span style="font-size: 0.8125rem; font-weight: 500; color: var(--color-text-subtle);">{{ role|upper if role else 'USER' }}</span>
                </div>
                
                <form method="post" action="/logout" style="margin: 0;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <button type="submit" class="btn btn-secondary btn-sm">
                        <i class="bi bi-box-arrow-right"></i>
                        Logout
                    </button>
                </form>
            </div>
        </nav>
        
        <!-- Main Container -->
        <div class="main-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <nav class="nav-section">
                    <a href="/dashboard" class="nav-item {% if request.path == '/dashboard' %}active{% endif %}">
                        <i class="bi bi-grid"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="/live" class="nav-item {% if request.path == '/live' %}active{% endif %}">
                        <i class="bi bi-camera-video"></i>
                        <span>Live Feed</span>
                    </a>
                    <a href="/incidents" class="nav-item {% if request.path == '/incidents' %}active{% endif %}">
                        <i class="bi bi-exclamation-triangle"></i>
                        <span>Incidents</span>
                    </a>
                </nav>
                
                <div class="nav-divider"></div>
                
                <nav class="nav-section">
                    <div class="nav-section-label">Management</div>
                    <a href="/devices" class="nav-item {% if request.path == '/devices' %}active{% endif %}">
                        <i class="bi bi-phone"></i>
                        <span>Devices</span>
                    </a>
                    <a href="/config" class="nav-item {% if request.path == '/config' %}active{% endif %}">
                        <i class="bi bi-sliders"></i>
                        <span>Configuration</span>
                    </a>
                </nav>
                
                <div class="nav-divider"></div>
                
                <nav class="nav-section">
                    <a href="/evidence/export" class="nav-item">
                        <i class="bi bi-download"></i>
                        <span>Export</span>
                    </a>
                    <a href="/health" class="nav-item">
                        <i class="bi bi-heart-pulse"></i>
                        <span>System Health</span>
                    </a>
                </nav>
            </aside>
            
            <!-- Content Area -->
            <main class="content-area">
                <div class="content-wrapper">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
